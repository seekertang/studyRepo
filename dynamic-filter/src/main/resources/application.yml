spring:
    application:
        name: morpheus
    datasource:
        url: jdbc:h2:mem:morpheus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driverClassName: org.h2.Driver
        username: sa
        password:
    h2:
        console:
            enabled: true
            path: /h2-console
    jpa:
        hibernate:
            ddl-auto: create
        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect
        show-sql: true
        defer-datasource-initialization: true
    sql:
        init:
            mode: always
